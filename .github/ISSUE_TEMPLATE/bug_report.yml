name: Bug Report
description: Report a reproducible problem with untis-to-api.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Please remove or redact passwords, API keys, email addresses, student data, staff data, and other sensitive information before submitting.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable set of steps that reproduces the issue.
      placeholder: |
        1. Configure ...
        2. Send ...
        3. Request ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release, commit, or deployment are you using?
      placeholder: "e.g. 1.0.0 or abc1234"

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Relevant runtime information.
      placeholder: "e.g. Cloudflare Workers, Node.js 20, npm 10"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include relevant logs or error messages. Redact sensitive information.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues.
          required: true
        - label: I have removed sensitive information from this report.
          required: true
